[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacurator"
version = "1.2.0"
description = "Deterministic, minimal-folder organizer and renamer for music, TV, movies, documents and photos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mutagen>=1.47",
  "Pillow>=10",
  "pillow-heif>=0.18",
  "psutil>=5.9",
  "platformdirs>=4",
  "keyring>=24",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
curator = "datacurator.cli:main"

[project.gui-scripts]
datacurator = "datacurator.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"datacurator.gui" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realfs: needs real loop-mounted filesystems (root on Linux); skipped otherwise",
  "gui: needs PySide6",
  "slow: benchmark-sized fixtures",
]
